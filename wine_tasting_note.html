<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>テイスティングノート | Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --border: #ecdfd0;
    --border-strong: #e0c9a8;
    --surface-1: #eee8d9;
    --surface-2: #fffcf6;
    --text-primary: #40342a;
    --text-secondary: #8a7a66;
    --text-muted: #b3a690;
    --accent: #d3785a;
    --accent-light: #fbe6db;
    --group-appearance: #c9922e;
    --group-appearance-bg: #fdf1de;
    --group-aroma: #9b7bc4;
    --group-aroma-bg: #f2ecfa;
    --group-palate: #d3705a;
    --group-palate-bg: #fceae4;
    --group-label: #5fa563;
    --group-label-bg: #ecf6ea;
    --group-drink: #5f8fc0;
    --group-drink-bg: #eaf2fa;
  }
  * { box-sizing: border-box; }
  html { background: var(--surface-1); }
  body {
    font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background:
      radial-gradient(circle at 8% 4%, rgba(211,120,90,0.07), transparent 40%),
      radial-gradient(circle at 95% 12%, rgba(95,165,99,0.06), transparent 40%),
      var(--surface-1);
    color: var(--text-primary);
    margin: 0;
    padding: 20px 16px 60px;
    line-height: 1.6;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 {
    font-family: 'Kaisei Decol', serif;
    font-weight: 700; font-size: 25px; margin: 4px 0 6px; color: #4a3626;
    display: flex; align-items: baseline; gap: 4px;
  }
  .wine-icon { flex-shrink: 0; }
  .version { font-size: 11px; font-weight: 500; color: var(--text-muted); font-family: 'Zen Maru Gothic', sans-serif; }
  .sub {
    display: flex; justify-content: space-between; align-items: baseline;
    color: var(--text-secondary); font-size: 13px; margin-bottom: 20px;
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: #e6d5b8; border-radius: 999px; padding: 5px; }
  .tab-btn {
    flex: 1; padding: 11px; border-radius: 999px; border: none;
    background: transparent; color: var(--text-secondary); font-size: 14px; font-weight: 700; cursor: pointer;
    transition: all 0.2s ease;
  }
  .tab-btn.active {
    background: #fff; color: var(--accent);
    box-shadow: 0 3px 10px rgba(211,120,90,0.18);
  }
  .view { display: none; }
  .view.active { display: block; }
  .card {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 18px;
    padding: 16px; margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(150,120,80,0.08);
  }
  .card h2 {
    font-size: 13px; margin: 0 0 12px; color: var(--text-secondary); font-weight: 700;
    display: inline-block; padding: 3px 10px; background: var(--surface-1); border-radius: 999px;
  }
  .term-group {
    border: 1.5px solid var(--border-strong); border-radius: 22px; padding: 14px; margin-bottom: 18px;
    box-shadow: 0 6px 18px rgba(150,120,80,0.07);
  }
  .term-group-title {
    font-family: 'Kaisei Decol', serif;
    font-size: 15px; font-weight: 700; margin-bottom: 12px; letter-spacing: 0.04em;
    display: flex; align-items: center; gap: 6px;
  }
  .term-group-title::before { content: '❁'; font-size: 13px; }
  .term-group .card:last-child { margin-bottom: 0; }
  .term-group--appearance { border-color: var(--group-appearance); background: var(--group-appearance-bg); }
  .term-group--appearance .term-group-title { color: var(--group-appearance); }
  .term-group--aroma { border-color: var(--group-aroma); background: var(--group-aroma-bg); }
  .term-group--aroma .term-group-title { color: var(--group-aroma); }
  .term-group--palate { border-color: var(--group-palate); background: var(--group-palate-bg); }
  .term-group--palate .term-group-title { color: var(--group-palate); }
  .term-group--label { border-color: var(--group-label); background: var(--group-label-bg); }
  .term-group--label .term-group-title { color: var(--group-label); }
  .term-group--drink { border-color: var(--group-drink); background: var(--group-drink-bg); }
  .term-group--drink .term-group-title { color: var(--group-drink); }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 13px; margin-bottom: 8px; font-weight: 700; color: var(--text-primary); }
  .field label.pill-label {
    font-size: 13px; color: var(--text-secondary); font-weight: 700;
    display: inline-block; padding: 3px 10px; background: var(--surface-1); border-radius: 999px;
  }
  .field .hint { color: var(--text-muted); font-size: 11px; margin-left: 4px; font-weight: 400; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); font-size: 14px; font-family: inherit;
  }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
  textarea { resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--border-strong);
    background: #fff; color: var(--text-primary); font-size: 13.5px; cursor: pointer;
    user-select: none; transition: all 0.15s ease; font-weight: 500;
  }
  .chip:active { transform: scale(0.95); }
  .chip.selected {
    background: linear-gradient(135deg, #e18b6b, var(--accent)); color: #fff; border-color: var(--accent);
    box-shadow: 0 3px 10px rgba(211,120,90,0.32); font-weight: 700;
  }
  .chip.answer-mark { outline: 3px solid var(--accent); outline-offset: 1px; }
  input.score-input { color: #b5651d; font-weight: 700; text-align: center; font-size: 18px; padding: 7px 4px; }
  .score-count-display {
    display: inline-block; width: 72px; flex: none; text-align: center;
    font-weight: 700; font-size: 18px; padding: 7px 4px;
    color: #b5651d; background: var(--surface-1); border-radius: 12px; border: 1.5px solid var(--border);
  }
  .save-btn, .action-btn {
    width: 100%; padding: 14px; border-radius: 999px; border: none;
    background: linear-gradient(135deg, #e18b6b, var(--accent));
    color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px;
    box-shadow: 0 8px 20px rgba(211,120,90,0.28);
  }
  .save-btn:active, .action-btn:active { opacity: 0.9; transform: scale(0.985); }
  .entry {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 18px;
    margin-bottom: 12px; overflow: hidden;
    box-shadow: 0 4px 14px rgba(150,120,80,0.08);
  }
  .entry.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent), 0 4px 14px rgba(150,120,80,0.08);
  }
  .entry-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; cursor: pointer;
  }
  .entry-row:active { background: var(--surface-1); }
  .entry-title { font-weight: 700; font-size: 15px; font-family: 'Kaisei Decol', serif; }
  .entry-date { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .entry-chevron { color: var(--accent); font-size: 12px; margin-left: 8px; }
  .entry-body span.tag {
    display: inline-block; background: var(--accent-light); color: var(--accent);
    border-radius: 999px; padding: 2px 9px; margin: 2px 3px 2px 0; font-size: 12px; font-weight: 600;
  }
  .entry-row-right { display: flex; align-items: center; gap: 10px; }
  .del-icon-btn {
    background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer;
    padding: 4px; line-height: 1; border-radius: 999px;
  }
  .del-icon-btn:active { background: #fbe0da; color: #d3524a; }
  .util-btn {
    background: var(--surface-1); border: 1.5px solid var(--border-strong); color: var(--text-secondary);
    font-size: 12px; font-weight: 700; cursor: pointer;
    padding: 6px 12px; border-radius: 999px;
  }
  .util-btn:active { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
  .empty { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 14px; }
  .type-toggle { display: flex; gap: 8px; margin-bottom: 4px; }
  .type-toggle button {
    flex: 1; padding: 10px; border-radius: 12px; border: 1.5px solid var(--border-strong);
    background: var(--surface-1); color: var(--text-secondary); font-size: 13px; cursor: pointer; font-weight: 700;
    transition: all 0.2s ease;
  }
  .type-toggle button.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 10px rgba(211,120,90,0.28); }
  .type-toggle button:disabled { cursor: default; }
  .status { font-size: 12.5px; color: var(--accent); margin-top: 8px; min-height: 16px; font-weight: 600; }

  .card .score-title {
    font-family: 'Zen Maru Gothic', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0.03em;
    color: #fff; margin: 0 0 12px; padding: 0;
    background: none; display: block; border-radius: 0;
  }
  .score-card { background: linear-gradient(135deg, #7ba3d0, var(--group-drink)); border-color: var(--group-drink); }

  .score-grid { display: flex; flex-direction: column; gap: 8px; }
  .score-row {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px;
    padding: 10px 12px 9px;
  }
  .score-row-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; gap: 8px; }
  .score-row-label {
    font-family: 'Kaisei Decol', serif; font-size: 13.5px; font-weight: 700; letter-spacing: 0.02em;
    color: var(--row-color, var(--text-primary)); display: flex; align-items: center; gap: 6px; min-width: 0;
  }
  .score-row-label::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--row-color, var(--accent)); flex-shrink: 0; }
  .score-row-value { font-size: 16px; font-weight: 700; color: #b5651d; white-space: nowrap; }
  .score-row-value small { font-size: 11px; font-weight: 500; color: var(--text-muted); margin-left: 1px; }
  .score-row-bar { height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; margin-bottom: 5px; }
  .score-row-bar-fill { height: 100%; border-radius: 999px; background: var(--row-color, var(--accent)); }
  .score-row-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--text-secondary); }

  .score-answers { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .score-answer-row {
    display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 10px;
    background: var(--group-label-bg); border-radius: 12px; padding: 9px 12px;
  }
  .score-answer-label { font-size: 13px; font-weight: 700; color: var(--group-label); }
  .score-answer-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .score-answer-badge.correct { background: var(--group-label); color: #fff; }
  .score-answer-badge.incorrect { background: #e4dcc9; color: var(--text-muted); }
  .score-answer-points { font-size: 16px; font-weight: 700; color: var(--group-label); text-align: right; white-space: nowrap; }
  .score-answer-points small { font-size: 10.5px; font-weight: 500; color: var(--text-secondary); margin-left: 2px; }

  .score-total-box {
    margin-top: 14px; color: #fff;
    display: flex; justify-content: flex-end; align-items: baseline; gap: 10px;
  }
  .score-total-label { font-family: 'Zen Maru Gothic', sans-serif; font-size: 21px; font-weight: 700; letter-spacing: 0.04em; }
  .score-total-value { font-size: 32px; font-weight: 700; }
  .score-total-value small { font-size: 15px; font-weight: 500; opacity: 0.85; }
</style>
</head>
<body>
<div class="wrap">
  <h1><a href="https://github.com/gkspkng/wine_tasting_note" target="_blank" rel="noopener noreferrer" style="color:inherit; text-decoration:none;">テイスティングノート</a><span class="wine-icon">🍷</span></h1>
  <div class="sub">
    <span>J.S.A.用語選択用紙をベースにしたデジタル記録ツール</span>
    <span class="version">v.1.5.11</span>
  </div>

  <div class="tabs" id="mainTabs">
    <button class="tab-btn active" data-view="input">記録する</button>
    <button class="tab-btn" data-view="list">記録一覧</button>
  </div>

  <div id="view-input" class="view active">
    <div class="status" id="saveStatus"></div>
    <div class="card">
      <div class="field">
        <label class="pill-label">タイトル</label>
        <input type="text" id="wineName" placeholder="例：第1回ブラインド No.1" style="background:#fff;">
      </div>
      <div class="field">
        <label class="pill-label">ワインの種類</label>
        <div class="type-toggle">
          <button id="type-white" class="active">白ワイン</button>
          <button id="type-red">赤ワイン</button>
        </div>
      </div>
    </div>

    <div id="form-sections"></div>

    <div class="card">
      <div class="field">
        <label>コメント</label>
        <textarea id="comment" rows="4" placeholder="" style="background:#fff;"></textarea>
      </div>
    </div>

    <button class="save-btn" id="saveBtn">この内容を記録する</button>
  </div>

  <div id="view-list" class="view">
    <div style="display:flex; justify-content:flex-end; gap:6px; margin-bottom:8px;">
      <button class="util-btn" id="exportBtn">📤 エクスポート</button>
      <button class="util-btn" id="importBtn">📥 インポート</button>
      <input type="file" id="importFile" accept=".csv,text/csv,text/plain" style="display:none;">
    </div>
    <div class="status" id="importStatus"></div>
    <div id="entryList"></div>
  </div>

  <div id="view-detail" class="view">
    <button class="util-btn" id="detailBackBtn" style="margin-bottom:14px;">← 一覧に戻る</button>
    <div id="detailHost"></div>
  </div>
</div>

<script>
const TERMS = {
  white: {
    "清澄度": {type:"multi", opts:["澄んだ","やや濁った","濁った"]},
    "輝き": {type:"multi", opts:["輝きのある","ややくすんだ","モヤがかかった"]},
    "色調": {type:"multi", opts:["シルバーがかった","グリーンがかった","レモンイエロー","イエロー","黄金色がかった","黄金色","トパーズ","オレンジ（グリ）を帯びた","アンバー"]},
    "濃淡": {type:"multi", opts:["無色に近い","淡い","やや濃い","濃い","非常に濃い"]},
    "粘性": {type:"multi", opts:["さらっとした","適度な","やや強い","ねっとりした"]},
    "外観の印象": {type:"multi", opts:["若々しい","軽快な","成熟度が高い","濃縮感がある","やや発展した","熟成のニュアンスが見える","熟成した","酸化が進んだ","気泡が見える","発泡性"]},
    "第一印象": {type:"multi", opts:["閉じている","控えめ","開いている","フレッシュな","ミネラリー","豊かな","熟度の高い","華やかな","濃縮感がある","セイボリーな","複雑な","力強い"]},
    "果実・花・植物": {type:"multi", opts:["柑橘類","青リンゴ","リンゴ","洋梨","花梨","白桃","アプリコット","パイナップル","マスカット","パッションフルーツ","バナナ","マンゴー","ライチ","スイカズラ","アカシア","白バラ","キンモクセイ","柑橘類の花","菩提樹","ミント","アニス","ヴェルヴェーヌ","ハーブ","タイム","ヘーゼルナッツ","フレッシュ・アーモンド"]},
    "香辛料・芳香化学物質": {type:"multi", opts:["石灰","火打石","貝殻","鉱物","海の香り","パン・ドゥ・ミ","トースト","ジンジャーブレッド","煙・燻製","ヴァニラ","シナモン","白胡椒","コリアンダーシード","丁子","香木","蜂蜜","花の蜜","乳製品","硫黄","麝香","ペトロール（ケロセン）","ワックス","蜜蝋","フェノール"]},
    "香りの印象": {type:"multi", opts:["若々しい","嫌気的な","熟成感が現れている","酸化熟成の段階にある","成熟度が高い","第1アロマが強い","第2アロマが強い","ニュートラル","木樽からのニュアンス"]},
    "アタック": {type:"multi", opts:["軽い","やや軽い","やや強い","強い","インパクトのある"]},
    "甘み": {type:"multi", opts:["ドライ","ソフトな","まろやか","豊かな","残糖がある"]},
    "酸味": {type:"multi", opts:["爽やかな","軽やかな","直線的","堅固な","なめらかな","はつらつとした","力強い"]},
    "苦味": {type:"multi", opts:["控えめ","穏やかな","コク（深み）を与える","旨みをともなった","強い（突出した）"]},
    "バランス": {type:"multi", opts:["スリムな","スムーズな","コンパクトな","ドライな","まろやかな","ねっとりした","ジューシーな","豊潤な","厚みのある","抑制された"]},
    "アルコール": {type:"multi", opts:["10.9%以下","11.0-11.9%","12.0-12.9%","13.0-13.9%","14%以上"]},
    "余韻": {type:"multi", opts:["短い","やや短い","やや長い","長い"]},
    "総合評価": {type:"multi", opts:["シンプル、フレッシュ感を楽しむ","成熟度が高く、豊かな","濃縮し、力強い","エレガントで、ミネラリー","滑らかで、バランスが良い","ポテンシャルの高い"]},
    "適正温度": {type:"multi", opts:["8度未満","8-10度","11-14度","15-18度","19度以上"]},
    "グラス": {type:"multi", opts:["小ぶり","中庸","大ぶり","バルーン型","チューリップ型"]},
    "収穫年": {type:"multi", opts:["2021","2022","2023","2024","2025","その他"]},
    "生産地（国）": {type:"multi", opts:["アメリカ","アルゼンチン","イタリア","オーストラリア","スペイン","チリ","ドイツ","日本","ニュージーランド","フランス","その他"]},
    "主なブドウ品種": {type:"multi", opts:["アリゴテ","アルバリーニョ","ヴィオニエ","グリューナー・ヴェルトリーナー","ゲヴュルツトラミネール","甲州","シャルドネ","シュナン・ブラン","ソーヴィニヨン・ブラン","トロンテス","ミュスカデ","リースリング","その他"]}
  },
  red: {
    "清澄度": {type:"multi", opts:["澄んだ","深みのある","やや濁った","濁った"]},
    "輝き": {type:"multi", opts:["輝きのある","艶のある","モヤがかかった"]},
    "色調": {type:"multi", opts:["紫がかった","オレンジがかった","黒みを帯びた","縁が明るい","ガーネット","ルビー","ダークチェリーレッド","ラズベリーレッド","トパーズ","マホガニー","レンガ"]},
    "濃淡": {type:"multi", opts:["淡い","明るい","やや明るい","やや濃い","濃い","非常に濃い"]},
    "粘性": {type:"multi", opts:["さらっとした","やや軽い","やや強い","強い"]},
    "外観の印象": {type:"multi", opts:["若々しい","若い状態を抜けた","軽快な","成熟度が高い","濃縮感が強い","やや熟成した","熟成した","酸化熟成のニュアンス","酸化が進んだ"]},
    "第一印象": {type:"multi", opts:["閉じている","控えめ","開いている","ミネラリー","強い","華やかな","濃縮感がある","深みのある","複雑な"]},
    "果実・花・植物": {type:"multi", opts:["イチゴ","ラズベリー","ブルーベリー","カシス","ブラックベリー","ブラックチェリー","干しプラム","乾燥イチジク","バラ","スミレ","牡丹","ゼラニウム","ピーマン","メントール","シダ","ローリエ","杉","針葉樹","ドライハーブ","タバコ","紅茶","キノコ","ユーカリ","スーボア","トリュフ","土","トマト","黒オリーブ"]},
    "香辛料・芳香化学物質": {type:"multi", opts:["黒胡椒","丁子","シナモン","ナツメグ","甘草","ヴァニラ","ロースト","生肉","乾いた肉","なめし皮","動物的なニュアンス","鉄分","グリエ","煙・燻製","樹脂","コーヒー","チョコレート","ヨード","ランシオ"]},

const SCORE_CONFIG = {
  appearance: { label: "外　観", multiplier: 2, items: 8, maxPoints: 16 },
  aroma: { label: "香　り", multiplier: 2, items: 12, maxPoints: 24 },
  palate: { label: "味わい", multiplier: 2.3, items: 7, maxPoints: 16.1 },
  drink: { label: "評　価", multiplier: 3, items: 4, maxPoints: 12 }
};

function formatPoints(n) {
  const rounded = Math.round(n * 10) / 10;
  return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
}

function categoryPointsList(correctCounts) {
  return Object.keys(SCORE_CONFIG).map(key => {
    const cfg = SCORE_CONFIG[key];
    const n = Number(correctCounts[key]) || 0;
    return { key, cfg, n, points: n * cfg.multiplier };
  });
}

function scoreOutputHtml(correctCounts) {
  const rows = categoryPointsList(correctCounts).map(({ key, cfg, n, points }) => {
    const pct = cfg.maxPoints > 0 ? Math.max(0, Math.min(100, (points / cfg.maxPoints) * 100)) : 0;
    return `<div class="score-row" style="--row-color:var(--group-${key});">
      <div class="score-row-top">
        <span class="score-row-label">${cfg.label}</span>
        <span class="score-row-value">${formatPoints(points)}<small>点</small></span>
      </div>
      <div class="score-row-bar"><div class="score-row-bar-fill" style="width:${pct}%"></div></div>
      <div class="score-row-meta"><span>${n}×${cfg.multiplier.toFixed(1)}</span><span>${cfg.items}項目・満点${formatPoints(cfg.maxPoints)}点</span></div>
    </div>`;
  }).join('');
  return `<div class="score-grid">${rows}</div>`;
}

const ANSWER_CONFIG = {
  country: { termKey: "生産地（国）", label: "　国　", points: 10 },
  year: { termKey: "収穫年", label: "収穫年", points: 6 },
  variety: { termKey: "主なブドウ品種", label: "品　種", points: 16 }
};
const ANSWER_BY_TERM_KEY = {};
Object.keys(ANSWER_CONFIG).forEach(key => { ANSWER_BY_TERM_KEY[ANSWER_CONFIG[key].termKey] = key; });

function answerPointsList(correctAnswers) {
  const countryOk = !!correctAnswers.country;
  return ['year', 'country', 'variety'].map(key => {
    const cfg = ANSWER_CONFIG[key];
    const ok = !!correctAnswers[key];
    const points = (ok && (key !== 'year' || countryOk)) ? cfg.points : 0;
    return { cfg, ok, points };
  });
}

function answerOutputHtml(correctAnswers) {
  const rows = answerPointsList(correctAnswers).map(({ cfg, ok, points }) => `
    <div class="score-answer-row">
      <span class="score-answer-label">${cfg.label}</span>
      <span class="score-answer-badge ${ok ? 'correct' : 'incorrect'}">${ok ? '正解' : '不正解'}</span>
      <span class="score-answer-points">${formatPoints(points)}<small>／${formatPoints(cfg.points)}点</small></span>
    </div>`).join('');
  return `<div class="score-answers">${rows}</div>`;
}

function scoreTotalHtml(correctCounts, correctAnswers) {
  const allPoints = categoryPointsList(correctCounts).map(p => p.points).concat(answerPointsList(correctAnswers).map(p => p.points));
  const total = allPoints.reduce((a, b) => a + b, 0);
  const maxTotal = Object.values(SCORE_CONFIG).reduce((a, cfg) => a + cfg.maxPoints, 0)
    + Object.values(ANSWER_CONFIG).reduce((a, cfg) => a + cfg.points, 0);
  return `<div class="score-total-box">
    <div class="score-total-label">合計</div>
    <div class="score-total-value">${formatPoints(total)}<small>／${formatPoints(maxTotal)}点</small></div>
  </div>`;
}

function computeAutoCorrectCounts(type, selections, answerSelections) {
  const counts = {};
  Object.keys(SCORE_CONFIG).forEach(g => counts[g] = 0);
  (SECTION_GROUPS[type] || SECTION_GROUPS.white).forEach(group => {
    if (!SCORE_CONFIG[group.cls]) return;
    let n = 0;
    group.keys.forEach(key => {
      const sel = selections[key] || [];
      const ans = answerSelections[key] || [];
      n += sel.filter(v => ans.indexOf(v) >= 0).length;
    });
    counts[group.cls] = Math.min(SCORE_CONFIG[group.cls].items, n);
  });
  return counts;
}

function computeAutoCorrectAnswers(selections, answerSelections) {
  const result = {};
  Object.keys(ANSWER_CONFIG).forEach(key => {
    const termKey = ANSWER_CONFIG[key].termKey;
    const sel = selections[termKey] || [];
    const ans = answerSelections[termKey] || [];
    result[key] = sel.some(v => ans.indexOf(v) >= 0);
  });
  return result;
}

function renderForm() {
  const container = document.getElementById('form-sections');
  container.innerHTML = '';
  const terms = TERMS[currentType];
  const keyToGroup = new Map();
  SECTION_GROUPS[currentType].forEach(group => {
    group.keys.forEach(key => { if (terms[key]) keyToGroup.set(key, group); });
  });
  const renderedGroups = new Set();

  Object.keys(terms).forEach(key => {
    const group = keyToGroup.get(key);
    if (!group) {
      container.appendChild(buildTermCard(key, terms[key]));
      return;
    }
    if (renderedGroups.has(group)) return;
    renderedGroups.add(group);
    const groupEl = document.createElement('div');
    groupEl.className = `term-group term-group--${group.cls}`;
    const title = document.createElement('div');
    title.className = 'term-group-title';
    title.textContent = group.title;
    groupEl.appendChild(title);
    group.keys.forEach(k => {
      if (terms[k]) groupEl.appendChild(buildTermCard(k, terms[k]));
    });
    container.appendChild(groupEl);
  });

  container.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const key = chip.parentElement.getAttribute('data-key');
      const val = chip.getAttribute('data-val');
      const def = terms[key];
      if (def.type === 'single') {
        selections[key] = selections[key][0] === val ? [] : [val];
        chip.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
        if (selections[key].length) chip.classList.add('selected');
      } else {
        const idx = selections[key].indexOf(val);
        if (idx >= 0) { selections[key].splice(idx, 1); chip.classList.remove('selected'); }
        else { selections[key].push(val); chip.classList.add('selected'); }
      }
    });
  });
}

async function getAllEntries() {
  const listRes = await window.storage.get('entry_ids').catch(() => null);
  const ids = listRes ? JSON.parse(listRes.value) : [];
  const entries = [];
  for (const id of ids) {
    try {
      const r = await window.storage.get(id);
      if (r) entries.push(JSON.parse(r.value));
    } catch (e) {}
  }
  return entries;
}

function htmlEscape(val) {
  const div = document.createElement('div');
  div.textContent = val == null ? '' : val;
  return div.innerHTML;
}

function csvEscape(val) {
  const s = String(val == null ? '' : val);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function entriesToCsv(entries) {
  const header = ['id', 'date', 'type', 'name', 'selections_json', 'comment', 'correct_counts_json', 'correct_answers_json', 'answer_selections_json'];
  const rows = entries.map(e => [
    e.id, e.date, e.type, e.name, JSON.stringify(e.selections), e.comment || '',
    JSON.stringify(e.correctCounts || {}), JSON.stringify(e.correctAnswers || {}), JSON.stringify(e.answerSelections || {})
  ].map(csvEscape).join(','));
  return header.join(',') + '\n' + rows.join('\n');
}

function downloadCsv(csvText, filename) {
  const blob = new Blob(['﻿' + csvText], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function parseCsv(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || r[0] !== '');
}

document.getElementById('exportBtn').addEventListener('click', async () => {
  const statusEl = document.getElementById('importStatus');
  const allEntries = await getAllEntries();
  if (!allEntries.length) { statusEl.textContent = 'エクスポートする記録がありません。'; return; }
  const csv = entriesToCsv(allEntries);
  downloadCsv(csv, `wine_tasting_notes_${new Date().toISOString().slice(0,10)}.csv`);
  statusEl.textContent = 'CSVを書き出しました。';
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  const statusEl = document.getElementById('importStatus');
  if (!file) return;
  try {
    const text = await file.text();
    const rows = parseCsv(text);
    if (rows.length < 2) { statusEl.textContent = '有効なデータが見つかりませんでした。'; return; }
    const header = rows[0];
    const idIdx = header.indexOf('id');
    const dateIdx = header.indexOf('date');
    const typeIdx = header.indexOf('type');
    const nameIdx = header.indexOf('name');
    const selIdx = header.indexOf('selections_json');
    const commentIdx = header.indexOf('comment');
    const correctCountsIdx = header.indexOf('correct_counts_json');
    const correctAnswersIdx = header.indexOf('correct_answers_json');
    const answerSelectionsIdx = header.indexOf('answer_selections_json');
    const listRes = await window.storage.get('entry_ids').catch(() => null);
    let ids = listRes ? JSON.parse(listRes.value) : [];
    let imported = 0;
    let overwritten = 0;
    for (let i = rows.length - 1; i >= 1; i--) {
      const r = rows[i];
      if (!r || r.length < header.length) continue;
      let id = r[idIdx] || ('entry_' + Date.now() + '_' + i);
      let selections = {};
      try { selections = JSON.parse(r[selIdx] || '{}'); } catch (e) { selections = {}; }
      let correctCounts = {};
      try { correctCounts = JSON.parse((correctCountsIdx >= 0 && r[correctCountsIdx]) || '{}'); } catch (e) { correctCounts = {}; }
      let correctAnswers = {};
      try { correctAnswers = JSON.parse((correctAnswersIdx >= 0 && r[correctAnswersIdx]) || '{}'); } catch (e) { correctAnswers = {}; }
      let answerSelections = {};
      try { answerSelections = JSON.parse((answerSelectionsIdx >= 0 && r[answerSelectionsIdx]) || '{}'); } catch (e) { answerSelections = {}; }
      const entry = {
        id, type: r[typeIdx] || 'white', name: r[nameIdx] || '(タイトル未入力)',
        date: r[dateIdx] || new Date().toISOString(), selections,
        comment: (commentIdx >= 0 && r[commentIdx]) || '',
        correctCounts, correctAnswers, answerSelections
      };
      await window.storage.set(entry.id, JSON.stringify(entry));
      if (ids.indexOf(entry.id) === -1) ids.unshift(entry.id);
      else overwritten++;
      imported++;
    }
    await window.storage.set('entry_ids', JSON.stringify(ids));
    statusEl.textContent = `${imported}件をインポートしました。` + (overwritten > 0 ? `（${overwritten}件上書き）` : '');
    loadEntries();
  } catch (err) {
    statusEl.textContent = 'インポートに失敗しました。CSVの形式を確認してください。';
  }
  e.target.value = '';
});

async function saveEntry() {
  const name = document.getElementById('wineName').value.trim();
  const statusEl = document.getElementById('saveStatus');
  const hasSelection = Object.values(selections).some(v => v.length > 0);
  if (!name && !hasSelection) {
    statusEl.textContent = 'ワイン名か、少なくとも1項目を入力してください。';
    window.scrollTo({ top: 0 });
    return;
  }
  const entry = {
    id: 'entry_' + Date.now(),
    type: currentType,
    name: name || '(タイトル未入力)',
    date: new Date().toISOString(),
    selections: JSON.parse(JSON.stringify(selections)),
    comment: document.getElementById('comment').value.trim()
  };
  try {
    const listRes = await window.storage.get('entry_ids').catch(() => null);
    let ids = listRes ? JSON.parse(listRes.value) : [];
    ids.unshift(entry.id);
    await window.storage.set('entry_ids', JSON.stringify(ids));
    await window.storage.set(entry.id, JSON.stringify(entry));

    statusEl.textContent = '記録しました。';
    document.getElementById('wineName').value = '';
    document.getElementById('comment').value = '';
    resetSelections();
    renderForm();
    window.scrollTo({ top: 0 });
    setTimeout(() => { statusEl.textContent = ''; }, 2000);
  } catch (e) {
    statusEl.textContent = '記録に失敗しました。';
    window.scrollTo({ top: 0 });
  }
}

function renderEditTermSections(type, editSelections, editCorrectCounts, editCorrectAnswers, entryId, onChange) {

  });
  const renderedGroups = new Set();
  Object.keys(terms).forEach(key => {
    const group = keyToGroup.get(key);
    if (!group) { container.appendChild(buildEditableTermCard(key, terms[key], editSelections)); return; }
    if (renderedGroups.has(group)) return;
    renderedGroups.add(group);
    const groupEl = document.createElement('div');
    groupEl.className = `term-group term-group--${group.cls}`;
    const title = document.createElement('div');
    title.className = 'term-group-title';
    title.textContent = group.title;
    groupEl.appendChild(title);
    group.keys.forEach(k => {
      if (!terms[k]) return;
      groupEl.appendChild(buildEditableTermCard(k, terms[k], editSelections));

      if (answerKey) {

      const scoreField = document.createElement('div');
      scoreField.style.cssText = 'display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-top:10px;';
      scoreField.innerHTML = `<label style="margin:0; white-space:nowrap; font-size:15px; font-weight:500; color:var(--group-${group.cls});">正解数 <span class="hint" style="font-size:14px; font-weight:400; color:var(--group-${group.cls});">（${scoreCfg.items}項目中）</span></label>
        <input type="number" class="score-input" inputmode="numeric" min="0" max="${scoreCfg.items}" step="1" value="${editCorrectCounts[group.cls]}" style="width:72px; flex:none; background:#fff;">`;
      const scoreInput = scoreField.querySelector('.score-input');
      scoreInput.addEventListener('input', () => {
        let n = Number(scoreInput.value) || 0;
        n = Math.max(0, Math.min(scoreCfg.items, n));
        if (String(n) !== scoreInput.value) scoreInput.value = n;
        editCorrectCounts[group.cls] = n;
        if (onChange) onChange();
      });
      groupEl.appendChild(scoreField);
    }
    container.appendChild(groupEl);
  });
  container.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const key = chip.parentElement.getAttribute('data-key');
      const val = chip.getAttribute('data-val');
      const def = terms[key];
      if (def.type === 'single') {
        editSelections[key] = editSelections[key][0] === val ? [] : [val];
        chip.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
        if (editSelections[key].length) chip.classList.add('selected');
      } else {
        const idx = editSelections[key].indexOf(val);
        if (idx >= 0) { editSelections[key].splice(idx, 1); chip.classList.remove('selected'); }
        else { editSelections[key].push(val); chip.classList.add('selected'); }
      }
    });
  });
  return container;
}

function buildAnswerTermCard(key, def, selections, answerSelections) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>${key}</h2>
    <div class="chips" data-key="${key}">
      ${def.opts.map(o => {
        const cls = ['chip'];
        if (selections[key].indexOf(o) >= 0) cls.push('selected');
        if (answerSelections[key].indexOf(o) >= 0) cls.push('answer-mark');
        return `<div class="${cls.join(' ')}" data-val="${htmlEscape(o)}">${o}</div>`;
      }).join('')}
    </div>`;
  return card;
}

function renderAnswerTermSections(type, selections, answerSelections, correctCounts, onChange) {
  const container = document.createElement('div');
  const terms = TERMS[type] || TERMS.white;
  const keyToGroup = new Map();
  (SECTION_GROUPS[type] || SECTION_GROUPS.white).forEach(group => {
    group.keys.forEach(key => { if (terms[key]) keyToGroup.set(key, group); });
  });
  const renderedGroups = new Set();
  Object.keys(terms).forEach(key => {
    const group = keyToGroup.get(key);
    if (!group) { container.appendChild(buildAnswerTermCard(key, terms[key], selections, answerSelections)); return; }
    if (renderedGroups.has(group)) return;
    renderedGroups.add(group);
    const groupEl = document.createElement('div');
    groupEl.className = `term-group term-group--${group.cls}`;
    const title = document.createElement('div');
    title.className = 'term-group-title';
    title.textContent = group.title;
    groupEl.appendChild(title);
    group.keys.forEach(k => {
      if (!terms[k]) return;
      groupEl.appendChild(buildAnswerTermCard(k, terms[k], selections, answerSelections));
    });
    const scoreCfg = SCORE_CONFIG[group.cls];
    if (scoreCfg) {
      const scoreField = document.createElement('div');
      scoreField.style.cssText = 'display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-top:10px;';
      scoreField.innerHTML = `<label style="margin:0; white-space:nowrap; font-size:15px; font-weight:500; color:var(--group-${group.cls});">正解数 <span class="hint" style="font-size:14px; font-weight:400; color:var(--group-${group.cls});">（${scoreCfg.items}項目中）</span></label>
        <span class="score-count-display" data-group="${group.cls}">${correctCounts[group.cls]}</span>`;
      groupEl.appendChild(scoreField);
    }
    container.appendChild(groupEl);
  });
  container.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const key = chip.parentElement.getAttribute('data-key');
      const val = chip.getAttribute('data-val');
      const idx = answerSelections[key].indexOf(val);
      if (idx >= 0) { answerSelections[key].splice(idx, 1); chip.classList.remove('answer-mark'); }
      else { answerSelections[key].push(val); chip.classList.add('answer-mark'); }
      if (onChange) onChange(key);
    });
  });
  return container;
}

function groupClsForKey(type, key) {
  const groups = SECTION_GROUPS[type] || SECTION_GROUPS.white;
  const group = groups.find(g => g.keys.indexOf(key) >= 0);
  return group ? group.cls : null;
}

function buildAnswerForm(entry) {
  const state = { answerSelections: makeAnswerSelections(entry), liveGroups: new Set(), liveAnswerKeys: new Set() };
  const wrap = document.createElement('div');
  wrap.className = 'edit-form';

  const infoCard = document.createElement('div');
  infoCard.className = 'card';
  infoCard.innerHTML = `
    <div class="field">
      <label class="pill-label">タイトル</label>
      <div style="font-size:14px; font-weight:700;">${htmlEscape(entry.name)}</div>
    </div>
    <div class="field">
      <label class="pill-label">ワインの種類</label>
      <div class="type-toggle"><button type="button" class="active" disabled>${entry.type === 'red' ? '赤ワイン' : '白ワイン'}</button></div>
    </div>`;
  wrap.appendChild(infoCard);

  const sectionsHost = document.createElement('div');
  wrap.appendChild(sectionsHost);

  const commentCard = document.createElement('div');
  commentCard.className = 'card';
  commentCard.innerHTML = `<div class="field"><label>コメント</label><textarea class="answer-comment" rows="4" style="background:#fff;">${htmlEscape(entry.comment || '')}</textarea></div>`;
  wrap.appendChild(commentCard);

  const scoreCard = document.createElement('div');
  scoreCard.className = 'card score-card';
  scoreCard.innerHTML = `<h2 class="score-title">採点結果</h2>
    <div class="score-output"></div>`;
  wrap.appendChild(scoreCard);
  const scoreOutputEl = scoreCard.querySelector('.score-output');
  function currentCounts() {
    const saved = makeEditCorrectCounts(entry);
    const computed = computeAutoCorrectCounts(entry.type, entry.selections || {}, state.answerSelections);
    const result = {};
    Object.keys(SCORE_CONFIG).forEach(g => { result[g] = state.liveGroups.has(g) ? computed[g] : saved[g]; });
    return result;
  }
  function currentAnswers() {
    const saved = makeEditCorrectAnswers(entry);
    const computed = computeAutoCorrectAnswers(entry.selections || {}, state.answerSelections);
    const result = {};
    Object.keys(ANSWER_CONFIG).forEach(k => { result[k] = state.liveAnswerKeys.has(k) ? computed[k] : saved[k]; });
    return result;
  }
  function updateScoreOutput() {
    const correctCounts = currentCounts();
    const correctAnswers = currentAnswers();
    scoreOutputEl.innerHTML = scoreOutputHtml(correctCounts)
      + answerOutputHtml(correctAnswers)
      + scoreTotalHtml(correctCounts, correctAnswers);
    return { correctCounts, correctAnswers };
  }

  const initialCounts = currentCounts();
  sectionsHost.appendChild(renderAnswerTermSections(entry.type, entry.selections || {}, state.answerSelections, initialCounts, (key) => {
    const cls = groupClsForKey(entry.type, key);
    if (cls && SCORE_CONFIG[cls]) state.liveGroups.add(cls);
    const answerKey = ANSWER_BY_TERM_KEY[key];
    if (answerKey) state.liveAnswerKeys.add(answerKey);
    const { correctCounts } = updateScoreOutput();
    sectionsHost.querySelectorAll('.score-count-display').forEach(el => {
      el.textContent = correctCounts[el.getAttribute('data-group')];
    });
  }));
  updateScoreOutput();

  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex; gap:8px; margin-top:10px;';
  btnRow.innerHTML = `
    <button type="button" class="action-btn answer-save-btn" style="margin:0;">保存</button>
    <button type="button" class="action-btn answer-cancel-btn" style="margin:0; background:var(--surface-1); color:var(--text-primary); border:1.5px solid var(--border-strong); box-shadow:none;">一覧に戻る</button>`;
  wrap.appendChild(btnRow);

  btnRow.querySelector('.answer-save-btn').addEventListener('click', async () => {
    const { correctCounts, correctAnswers } = updateScoreOutput();
    const comment = commentCard.querySelector('.answer-comment').value.trim();
    const updated = {
      ...entry,
      answerSelections: state.answerSelections,
      correctCounts,
      correctAnswers,
      comment
    };
    await window.storage.set(updated.id, JSON.stringify(updated));
    closeEntryDetail(updated.id);
  });
  btnRow.querySelector('.answer-cancel-btn').addEventListener('click', () => {
    closeEntryDetail(entry.id);
  });

  return wrap;
}

function buildEditForm(entry) {
  const state = { type: entry.type, selections: makeEditSelections(entry), correctCounts: makeEditCorrectCounts(entry), correctAnswers: makeEditCorrectAnswers(entry) };
  const wrap = document.createElement('div');
  wrap.className = 'edit-form';

  const infoCard = document.createElement('div');
  infoCard.className = 'card';
  infoCard.innerHTML = `
    <div class="field">
      <label class="pill-label">タイトル</label>
      <input type="text" class="edit-name" value="${htmlEscape(entry.name)}" style="background:#fff;">
    </div>
    <div class="field">
      <label class="pill-label">ワインの種類</label>
      <div class="type-toggle">
        <button type="button" class="edit-type-btn${state.type === 'white' ? ' active' : ''}" data-type="white">白ワイン</button>
        <button type="button" class="edit-type-btn${state.type === 'red' ? ' active' : ''}" data-type="red">赤ワイン</button>
      </div>
    </div>`;
  wrap.appendChild(infoCard);

  const sectionsHost = document.createElement('div');
  wrap.appendChild(sectionsHost);

  const commentCard = document.createElement('div');
  commentCard.className = 'card';
  commentCard.innerHTML = `<div class="field"><label>コメント</label><textarea class="edit-comment" rows="4" style="background:#fff;">${htmlEscape(entry.comment || '')}</textarea></div>`;
  wrap.appendChild(commentCard);

  const scoreCard = document.createElement('div');
  scoreCard.className = 'card score-card';
  scoreCard.innerHTML = `<h2 class="score-title">採点結果</h2>
    <div class="score-output"></div>`;
  wrap.appendChild(scoreCard);
  const scoreOutputEl = scoreCard.querySelector('.score-output');
  function updateScoreOutput() {
    scoreOutputEl.innerHTML = scoreOutputHtml(state.correctCounts)
      + answerOutputHtml(state.correctAnswers)
      + scoreTotalHtml(state.correctCounts, state.correctAnswers);
  }

  sectionsHost.appendChild(renderEditTermSections(state.type, state.selections, state.correctCounts, state.correctAnswers, entry.id, updateScoreOutput));
  updateScoreOutput();

  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex; gap:8px; margin-top:10px;';
  btnRow.innerHTML = `
    <button type="button" class="action-btn edit-save-btn" style="margin:0;">更新</button>
    <button type="button" class="action-btn edit-cancel-btn" style="margin:0; background:var(--surface-1); color:var(--text-primary); border:1.5px solid var(--border-strong); box-shadow:none;">一覧に戻る</button>`;
  wrap.appendChild(btnRow);

  infoCard.querySelectorAll('.edit-type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const newType = btn.getAttribute('data-type');
      if (newType === state.type) return;
      state.type = newType;
      state.selections = emptySelections(newType);
      infoCard.querySelectorAll('.edit-type-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-type') === newType));
      sectionsHost.innerHTML = '';
      sectionsHost.appendChild(renderEditTermSections(state.type, state.selections, state.correctCounts, state.correctAnswers, entry.id, updateScoreOutput));
      updateScoreOutput();
    });
  });

  btnRow.querySelector('.edit-save-btn').addEventListener('click', async () => {
    const name = infoCard.querySelector('.edit-name').value.trim();
    const comment = commentCard.querySelector('.edit-comment').value.trim();
    const updated = {
      ...entry,
      type: state.type,
      name: name || '(タイトル未入力)',
      selections: state.selections,
      correctCounts: state.correctCounts,
      correctAnswers: state.correctAnswers,
      comment
    };
    await window.storage.set(updated.id, JSON.stringify(updated));
    closeEntryDetail(updated.id);
  });
  btnRow.querySelector('.edit-cancel-btn').addEventListener('click', () => {
    closeEntryDetail(entry.id);
  });

  return wrap;
}

function buildEntryDetail(entry) {
  let mode = 'answer';
  const wrap = document.createElement('div');

  const modeToggle = document.createElement('div');
  modeToggle.className = 'tabs';
  modeToggle.style.marginBottom = '14px';
  modeToggle.innerHTML = `
    <button type="button" class="mode-btn tab-btn active" data-mode="answer">採点</button>
    <button type="button" class="mode-btn tab-btn" data-mode="edit">編集</button>`;
  wrap.appendChild(modeToggle);

  const bodyHost = document.createElement('div');
  wrap.appendChild(bodyHost);

  function renderMode() {
    bodyHost.innerHTML = '';
    bodyHost.appendChild(mode === 'answer' ? buildAnswerForm(entry) : buildEditForm(entry));
  }
  modeToggle.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const m = btn.getAttribute('data-mode');
      if (m === mode) return;
      mode = m;
      modeToggle.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-mode') === m));
      renderMode();
    });
  });
  renderMode();

  return wrap;
}

let listScrollY = 0;

function showListView() {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-list').classList.add('active');
  document.getElementById('mainTabs').style.display = '';
  window.scrollTo({ top: listScrollY });
}

function showEntryDetail(entry) {
  listScrollY = window.scrollY;
  document.getElementById('importStatus').textContent = '';
  const host = document.getElementById('detailHost');
  host.innerHTML = '';
  host.appendChild(buildEntryDetail(entry));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-detail').classList.add('active');
  document.getElementById('mainTabs').style.display = 'none';
  window.scrollTo({ top: 0 });
}

async function closeEntryDetail(id) {
  await refreshEntry(id);
  showListView();
}

let selectedEntryId = null;

function buildEntryElement(entry) {
  const div = document.createElement('div');
  div.className = 'entry' + (entry.id === selectedEntryId ? ' selected' : '');
  div.dataset.id = entry.id;
  const dateStr = new Date(entry.date).toLocaleString('ja-JP');
  div.innerHTML = `
    <div class="entry-row">
      <div>
        <div class="entry-title">${htmlEscape(entry.name)}</div>
        <div class="entry-date">${dateStr}</div>
      </div>
      <div class="entry-row-right">
        <button class="del-icon-btn" aria-label="削除" title="削除">🗑</button>
        <span class="entry-chevron">▶</span>
      </div>
    </div>`;

  div.querySelector('.entry-row').addEventListener('click', () => {
    selectedEntryId = entry.id;
    document.querySelectorAll('#entryList .entry.selected').forEach(el => el.classList.remove('selected'));
    div.classList.add('selected');
    showEntryDetail(entry);
  });

  div.querySelector('.del-icon-btn').addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!confirm('この記録を削除しますか？')) return;
    try {
      const listRes = await window.storage.get('entry_ids').catch(() => null);
      let ids2 = listRes ? JSON.parse(listRes.value) : [];
      ids2 = ids2.filter(x => x !== entry.id);
      await window.storage.set('entry_ids', JSON.stringify(ids2));
      await window.storage.delete(entry.id).catch(() => {});
      if (selectedEntryId === entry.id) selectedEntryId = null;
      div.remove();
      const listEl = document.getElementById('entryList');
      if (!listEl.children.length) listEl.innerHTML = '<div class="empty">まだ記録がありません。</div>';
    } catch (e) {}
  });

  return div;
}

async function refreshEntry(id) {
  const listEl = document.getElementById('entryList');
  const oldDiv = Array.from(listEl.children).find(el => el.dataset && el.dataset.id === id);
  let entryRes;
  try { entryRes = await window.storage.get(id); } catch (e) { entryRes = null; }
  if (!entryRes) {
    if (oldDiv) oldDiv.remove();
    if (!listEl.children.length) listEl.innerHTML = '<div class="empty">まだ記録がありません。</div>';
    return;
  }
  const entry = JSON.parse(entryRes.value);
  const newDiv = buildEntryElement(entry);
  if (oldDiv) oldDiv.replaceWith(newDiv);
  else listEl.appendChild(newDiv);
}

async function loadEntries() {
  const listEl = document.getElementById('entryList');
  listEl.innerHTML = '<div class="empty">読み込み中...</div>';
  try {
    const listRes = await window.storage.get('entry_ids').catch(() => null);
    const ids = listRes ? JSON.parse(listRes.value) : [];
    if (!ids.length) {
      listEl.innerHTML = '<div class="empty">まだ記録がありません。</div>';
      return;
    }
    listEl.innerHTML = '';
    for (const id of ids) {
      let entryRes;
      try { entryRes = await window.storage.get(id); } catch (e) { continue; }
      if (!entryRes) continue;
      const entry = JSON.parse(entryRes.value);
      listEl.appendChild(buildEntryElement(entry));
    }
  } catch (e) {
    listEl.innerHTML = '<div class="empty">読み込みに失敗しました。</div>';
  }
}

document.getElementById('detailBackBtn').addEventListener('click', () => {
  showListView();
});

renderForm();
</script>
</body>
